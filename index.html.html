function confetti(){for(let i=0;i<28;i++){let e=document.createElement('div');e.className='cf';e.textContent='♠♥♦♣'[i%4];e.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;color:${i%4%3?'#ff5252':'#f3ead2'};font-size:${16+Math.random()*18}px`;document.body.append(e);setTimeout(()=>e.remove(),3500)}}
function endFx(w){snd(w?'win':'lose');if(w)confetti()}
function hlIdx(h,l){let u=[];l.forEach(c=>{let i=h.findIndex((x,k)=>x==c&&!u.includes(k));if(i>=0)u.push(i)});return u}
function ext(t,ix){let ms=S.melds[t],cs=ix.map(i=>S.hands[t][i]),n=cs.filter(c=>!wild(c));if(!cs.length||!ms.length)return -1;if(n.length){let r=rk(n[0]);return n.every(c=>rk(c)==r)?ms.findIndex(m=>m.r==r):-1}let k=ms.findIndex(m=>m.r!='2');return k<0?0:k}
function bloque(){let d=document.createElement('div');d.className='bq';d.textContent='BLOQUÉÉÉ!';document.body.append(d);snd('bq');setTimeout(()=>d.remove(),2200);try{let u=new SpeechSynthesisUtterance('Bloqueeeé');u.lang='fr-FR';u.pitch=1.8;u.rate=.65;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function take(t,ix){let h=S.hands[t],cs=ix.map(i=>h[i]);cs.forEach(c=>{let k=S.hl[t].indexOf(c);if(k>=0)S.hl[t].splice(k,1)});S.hands[t]=h.filter((c,i)=>!ix.includes(i));return cs}
function doMeld(t,ix){let cs=ix.map(i=>S.hands[t][i]),r=okSet(cs);if(!r)return false;take(t,ix);S.melds[t].push({r,c:cs});cs.forEach(c=>sfx(c));S.msg=nm(t)+' laid down '+cs.length+' cards.';snd('meld');chk(t);return true}
function doAdd(t,ix,mi){let m=S.melds[t][mi],cs=ix.map(i=>S.hands[t][i]);if(!m||!cs.length||!cs.every(c=>wild(c)||rk(c)==m.r))return false;take(t,ix);m.c.push(...cs);cs.forEach(c=>sfx(c));S.msg=nm(t)+' added to a set.';snd('ext');chk(t);return true}
function doDisc(t,i){let c=take(t,[i])[0];S.pile.push(c);S.turn=1-t;S.phase='draw';S.msg=nm(t)+' discarded.';snd('disc');S.hl[t]=[];if(!wild(c)&&S.melds[1-t].some(m=>m.r==rk(c))){S.blk=1-t;S.bq++;S.msg=nm(t)+' discarded a '+rk(c)+'. '+nm(1-t)+' got BLOQUÉ!'}chk(t)}
function chk(t){if(!S.hands[t].length)endRound()}
function endRound(){S.out=S.hands.findIndex(h=>!h.length);S.res=[0,1].map(i=>{let m=S.melds[i].reduce((a,x)=>a+x.c.reduce((b,c)=>b+pts(c),0),0),h=S.hands[i].reduce((a,c)=>a+pts(c),0);return{m,h,d:m-h}});S.res.forEach((r,i)=>S.scores[i]+=r.d);S.over=true}
function save(){sel=[];render();if(!ai)sendS()}
function aiTurn(){if(!S||S.over||S.turn!=1||!ai){busy=false;return}
let top=S.pile[S.pile.length-1],H=S.hands[1];
(S.blk!=1&&top&&(wild(top)||pts(top)>=50||S.pile.length>=4||H.some(c=>rk(c)==rk(top))||S.melds[1].some(m=>m.r==rk(top))))?dPile(1):dStock(1);
render();setTimeout(aiPlay,1100)}
function aiPlay(){busy=false;if(S.over)return;const h=()=>S.hands[1],ms=S.melds[1];
for(let g=1;g&&!S.over;){g=0;let by={};h().forEach((c,i)=>{if(!wild(c))(by[rk(c)]=by[rk(c)]||[]).push(i)});let w=h().findIndex(wild);
for(const r in by){let ix=by[r];if(ix.length>=3){doMeld(1,ix);g=1;break}if(ix.length==2&&w>=0){doMeld(1,[...ix,w]);g=1;break}}}
for(let n=0;n<40&&!S.over;n++){let d=0;for(let i=0;i<h().length&&!d;i++){let c=h()[i],mi=wild(c)?ms.findIndex(m=>m.r!='2'):ms.findIndex(m=>m.r==rk(c));if(mi>=0){doAdd(1,[i],mi);d=1}}if(!d)break}
if(!S.over){let cnt={};h().forEach(c=>cnt[rk(c)]=(cnt[rk(c)]||0)+1);let b=0,bs=1e9;h().forEach((c,i)=>{let s=(wild(c)?1000:0)+(cnt[rk(c)]>1?200:0)+pts(c);if(s<bs){bs=s;b=i}});doDisc(1,b)}
save()}
function card(c,o={}){if(o.b)return`<div class="c b ${o.m?'m':''}"></div>`;let j=rk(c)=='X';
return`<div class="c ${'HD'.includes(su(c))?'r':''} ${j?'j':''} ${o.s?'s':''} ${o.n?'n':''} ${o.m?'m':''} ${o.p?'p':''} ${c=='JD'||c=='QS'?'k':''}" ${o.i!=null?'data-i="'+o.i+'"':''}>${j?'<small>★</small>JK':rk(c)+'<small>'+SY[su(c)]+'</small>'}</div>`}
const meldH=(m,mi,t,x)=>`<div class="meld ${t?'t':''} ${x?'x':''}" ${t?'data-m="'+mi+'"':''}>${[...m.c].sort((a,b)=>sc(a)-sc(b)).map(c=>card(c,{m:1})).join('')}<i>${m.c.length}</i></div>`;
const sc=c=>wild(c)?0:(c=='JD'||c=='QS')?2:1;
function menuH(){return`<div class="ov"><div class="card"><h2>♠ Dame de Pique ♠</h2>
<button data-a="ai">Play vs Computer</button>
<button data-a="host">Host online game</button>
<div style="display:flex;gap:6px;align-items:center"><input id="cd" maxlength="5" placeholder="Room code" autocapitalize="characters" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #e6c36a88;background:#0006;color:#f3ead2;font:inherit;text-transform:uppercase"><button data-a="joinc" style="width:auto;margin:0">Join</button></div>
${net?'<p style="font-size:14px;color:var(--gold)">'+net+'</p>':''}${room&&net.includes('Waiting for your')?'<input id="lk" readonly value="'+lnk()+'" style="width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid #e6c36a88;background:#0006;color:#f3ead2;font:13px sans-serif"><button data-a="share">Copy invite link</button>'+(location.protocol=='file:'?'<p style="font-size:12px">This link only works once the file is hosted online (e.g. GitHub Pages). Until then, share the room code.</p>':''):''}
${S?'<button class="s2" data-a="resume">Resume current game</button>':''}<details><summary>How to play</summary><p style="text-align:left;font-size:13px">Each turn: tap the deck (hidden card) or the top discard (you take the whole pile). Lay down 3+ cards of one rank (2s and Jokers are wild, with at least 1 real card, so 2+Joker+7 works). Extend your own sets with matching cards or wilds. Cards with a blue + can be added to a blue-glowing set; green glow marks cards you just picked up. Then discard one card. <b>Bloque:</b> if you discard a rank your opponent has a set of, they must draw from the deck. Empty your hand to end the round. Sets score +, cards left in hand score −. 2–9 = 5, 10–A = 10, 2/Joker = 20, J♦ = 50, Q♠ = 100.</p></details></div></div>`}
function render(){S=ai?L:D;const a=$('#app');if(S&&!S.hl){S.hl=[[],[]];S.bq=0;S.blk=-1}
if(!S||menu){a.innerHTML=menuH();return}
me=ai?0:S.seats.indexOf(myid);const v=me<0?0:me,o=1-v,mine=me>=0&&!S.over&&S.turn==me&&(S.seats[1]||ai);
const wait=!ai&&!S.seats[1],canJoin=wait&&me<0;
let h=`<div class="bar"><h1>♠ DAME DE PIQUE · R${S.round}</h1><span><button class="s2" data-a="snd" style="padding:5px 10px">${mute?'🔇':'🔊'}</button> <button class="s2" data-a="menu" style="padding:5px 10px">Menu</button></span></div>`;
if(net)h+=`<div class="lbl" style="text-align:center">${net}</div>`;
if(wait){h+=`<div class="card" style="margin:20px auto"><h2>Waiting for your partner…</h2><p>Share this page’s link with her. She needs access that lets her interact, then she taps Join.</p>${canJoin?'<button data-a="join">Join as player 2</button>':''}</div>`;a.innerHTML=h;return}
h+=`<div class="sec" style="max-height:30%;overflow:auto"><div class="lbl">${S.turn==o&&!S.over?'● ':''}${nm(o)} · ${S.hands[o].length} cards · <b>${S.scores[o]}</b> pts</div><div class="row">${S.melds[o].map((m,i)=>meldH(m,i,0)).join('')||'<span class="lbl">No sets yet</span>'}</div></div>`;
const top=S.pile[S.pile.length-1],dr=mine&&S.phase=='draw',bk=dr&&S.blk==me,hn=hlIdx(S.hands[v],S.hl[v]||[]),pl=mine&&S.phase=='play'?S.hands[v].map((c,i)=>i).filter(i=>ext(me,[i])>=0):[],hint=dr?(bk?'Draw from the deck.':'Tap the deck or top discard.'):(ai&&S.turn==1&&!S.over?'Thinking…':'');
h+=`<div class="tbl"><div class="pc ${dr?'g':''}" data-a="stock"><div class="c b"></div><b>Deck ${S.deck.length}</b></div>
<div class="msg">${note||(S.msg||'')+(hint?'<br><b>'+hint+'</b>':'')}</div>
<div class="pc ${dr&&top&&!bk?'g':''}" data-a="pile">${top?card(top):'<div class="c e"></div>'}<b>Discards ${S.pile.length}</b></div></div>
<div class="sec" style="flex:1;min-height:56px;overflow:auto"><div class="lbl">${S.turn==v&&!S.over?'● ':''}${nm(v)} · <b>${S.scores[v]}</b> pts</div><div class="row">${S.melds[v].map((m,i)=>meldH(m,i,mine&&S.phase=='play'&&sel.length,mine&&S.phase=='play'&&S.hands[v].some(c=>wild(c)||rk(c)==m.r))).join('')||'<span class="lbl">No sets yet</span>'}</div></div>
<div class="hand">${S.hands[v].map((c,i)=>card(c,{i,s:sel.includes(i),n:hn.includes(i),p:pl.includes(i)})).join('')}</div>
<div class="acts"><button data-a="meld" ${mine&&S.phase=='play'&&sel.length>=3?'':'disabled'}>Lay down set</button><button data-a="ext" ${mine&&S.phase=='play'&&sel.length&&ext(me,sel)>=0?'':'disabled'}>Extend set</button><button data-a="disc" ${mine&&S.phase=='play'&&sel.length==1?'':'disabled'}>Discard</button></div>
`;
if(S.over){const r=S.res;h+=`<div class="ov"><div class="card"><h2>${S.out<0?'Deck ran out':nm(S.out)+(S.out==me||ai&&S.out==0?' went out!':' went out!')}</h2><table><tr><th></th><th>${nm(v)}</th><th>${nm(o)}</th></tr>
<tr><td>Sets</td><td>+${r[v].m}</td><td>+${r[o].m}</td></tr><tr><td>In hand</td><td>−${r[v].h}</td><td>−${r[o].h}</td></tr><tr><td>Round</td><td>${r[v].d}</td><td>${r[o].d}</td></tr><tr><th>Total</th><th>${S.scores[v]}</th><th>${S.scores[o]}</th></tr></table>
${me>=0?'<button data-a="next">Next round</button>':''}</div></div>`}
a.innerHTML=h;if(seen>=0&&S.bq>seen)bloque();seen=S.bq;if(note!=ln){if(note)snd('bad');ln=note}if(mine&&S.phase=='draw'){if(!tp)snd('turn');tp=1}else tp=0;let ek=S.over?S.round+'-'+S.scores:'';if(ek&&ek!=es)endFx(S.res[v].d>S.res[o].d);es=ek;
if(ai&&S.turn==1&&!S.over&&!busy){busy=true;setTimeout(aiTurn,1000)}}
$('#app').onclick=e=>{const x=e.target.closest('[data-a],[data-i],[data-m]');if(!x||!S&&!x.dataset.a)return;const d=x.dataset;note='';
const mine=S&&me>=0&&!S.over&&S.turn==me&&(S.seats[1]||ai);
if(d.i!=null){snd('tap');let i=+d.i;sel=sel.includes(i)?sel.filter(k=>k!=i):[...sel,i];return render()}
if(d.m!=null){if(mine&&S.phase=='play'&&sel.length){if(doAdd(me,sel,+d.m))return save();note='Those cards don’t fit that set.'}return render()}
switch(d.a){
case'ai':ai=true;L=fresh();S=L;L.mode='ai';deal();menu=false;return save();
case'host':ai=false;myid='host';menu=true;host();return;
case'joinc':join($('#cd').value);return;
case'share':{let u=lnk(),i=$('#lk'),m=r=>{net='Waiting for your partner\u2026 Code: '+room+' \u2014 '+r;render()};
let f=()=>{let ok=0;try{i.select();i.setSelectionRange(0,999);ok=document.execCommand('copy')}catch(e){}m(ok?'link copied!':'tap the link above and copy it');let j=$('#lk');if(j&&!ok){j.focus();j.select()}};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>m('link copied!'),f);else f();return}
case'resume':menu=false;return render();
case'snd':mute=!mute;return render();
case'menu':menu=true;return render();
case'join':D.seats[1]=myid;return save();
case'stock':if(mine&&S.phase=='draw'){dStock(me);save()}return;
case'pile':if(mine&&S.phase=='draw'&&S.pile.length){if(S.blk==me){note='Bloqué! You must draw from the deck.';return render()}dPile(me);save()}return;
case'ext':if(mine&&S.phase=='play'){let k=ext(me,sel);if(k>=0&&doAdd(me,sel,k))return save()}return;
case'meld':if(mine&&S.phase=='play'){if(doMeld(me,sel))return save();note='A set needs 3+ cards of one rank (wilds need at least 1 real card).';render()}return;
case'disc':if(mine&&S.phase=='play'&&sel.length==1){doDisc(me,sel[0]);save()}return;
case'next':S.round++;S.starter=1-S.starter;deal();return save();}};
function lnk(){return location.href.split('#')[0]+'#'+room}
function nope(){if(typeof Peer=='undefined'){net='Could not load the connection library. Check your internet.';render();return 1}}
function cleanup(){try{peer&&peer.destroy()}catch(e){}conn=null;D=null}
function sendS(){if(conn&&conn.open)conn.send(D)}
function wire(c){c.on('data',d=>{let f=!D;D=d;if(f)menu=false;net='';render()});c.on('close',()=>{net='\u26a0 Partner disconnected. Reopen the link to reconnect.';render()})}
function host(){if(nope())return;cleanup();room=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer('dpq-'+room,PO);peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
peer.on('open',()=>{net='Waiting for your partner\u2026 Code: '+room;render()});
peer.on('error',e=>{if(e.type=='unavailable-id')return host();net='Connection problem ('+e.type+')';render()});
peer.on('connection',c=>{conn=c;wire(c);ice(c);c.on('open',()=>{if(!D||!D.seats[1]){ai=false;D=fresh();D.seats=['host','guest'];S=D;deal()}net='';menu=false;sendS();render()})});render()}
const PO={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443'],username:'openrelayproject',credential:'openrelayproject'}]}};
let to;
function ice(c){setTimeout(()=>{try{let p=c.peerConnection;if(p)p.oniceconnectionstatechange=()=>{if(p.iceConnectionState=='failed'){net='\u26a0 Your networks are blocking the direct link. Try switching one phone to wifi (or off VPN), then retry.';render()}}}catch(e){}},300)}
function join(code){if(nope())return;cleanup();clearTimeout(to);ai=false;myid='guest';room='';net='Contacting the matchmaking server\u2026';render();peer=new Peer(PO);
peer.on('open',()=>{net='Server reached. Connecting to the host\u2026';render();conn=peer.connect('dpq-'+String(code).toUpperCase().trim(),{reliable:true});wire(conn);ice(conn);conn.on('open',()=>{clearTimeout(to);net='Connected! Waiting for the host\u2026';render()})});
peer.on('disconnected',()=>{if(!conn||!conn.open){net='Lost the matchmaking server. Check your internet and retry.';render()}});
peer.on('error',e=>{clearTimeout(to);net=e.type=='peer-unavailable'?'No game found with that code. Check the code and make sure the host page is still open.':'Connection problem ('+e.type+')';render()});
to=setTimeout(()=>{if(!conn||!conn.open){net='Still not connected after 20s. Make sure the host page is open and waiting, then retry. If it keeps failing, switch one phone to wifi.';render()}},20000)}
if(location.hash.length>1)join(location.hash.slice(1));else render();
</script></body></html>
