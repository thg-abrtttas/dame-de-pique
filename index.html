<script>

function canTakePile(t){let top=S.pile[S.pile.length-1];return !!top&&!wild(top)&&S.hands[t].filter(c=>!wild(c)&&rk(c)===rk(top)).length>=2}

let AC=null,audioReady=false;

function tone(f,t0,d,ty,v){if(mute||!AC)return;let o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t0;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(Math.min(v,.13),n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.onended=()=>{o.disconnect();g.disconnect()};o.start(n);o.stop(n+d+.01)}
function sfx(c){if(c!=='JD'&&c!=='QS'||!ac())return;try{if(c==='JD')[784,988,1175,1568].forEach((f,i)=>tone(f,i*.075,.35,'triangle',.09));else [[392,0],[311,.12],[247,.24],[196,.36]].forEach(([f,t])=>tone(f,t,.34,'triangle',.12))}catch(e){}}

function confetti(){for(let i=0;i<28;i++){let e=document.createElement('div');e.className='cf';e.textContent='♠♥♦♣'[i%4];e.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;color:${i%4%3?'#ff5252':'#f3ead2'};font-size:${16+Math.random()*18}px`;document.body.append(e);setTimeout(()=>e.remove(),3500)}}

function hlIdx(h,l){let u=[];l.forEach(c=>{let i=h.findIndex((x,k)=>x==c&&!u.includes(k));if(i>=0)u.push(i)});return u}

  const synth=window.speechSynthesis;

function bloque(){
 let d=document.createElement('div');d.className='bq';d.textContent='BLOQUÉÉÉ!';document.body.append(d);

}
function take(t,ix){let h=S.hands[t],cs=ix.map(i=>h[i]);cs.forEach(c=>{let k=S.hl[t].indexOf(c);if(k>=0)S.hl[t].splice(k,1)});S.hands[t]=h.filter((c,i)=>!ix.includes(i));return cs}

function chk(t){if(!S.hands[t].length)endRound()}
function endRound(){S.out=S.hands.findIndex(h=>!h.length);S.res=[0,1].map(i=>{let m=S.melds[i].reduce((a,x)=>a+x.c.reduce((b,c)=>b+pts(c),0),0),h=S.hands[i].reduce((a,c)=>a+pts(c),0);return{m,h,d:m-h}});S.res.forEach((r,i)=>S.scores[i]+=r.d);S.history=S.history||[];S.history.push({round:S.round,points:S.res.map(x=>x.d),totals:[...S.scores]});S.over=true}
function save(){sel=[];render();if(!ai)sendS()}
function aiTurn(){if(!S||S.over||S.turn!=1||!ai){busy=false;return}
(S.blk!==1&&canTakePile(1))?dPile(1):dStock(1);
render();setTimeout(aiPlay,1100)}
function aiPlay(){busy=false;if(S.over)return;const h=()=>S.hands[1],ms=S.melds[1];

save()}
function card(c,o={}){if(o.b)return`<div class="c b ${o.m?'m':''}"></div>`;let j=rk(c)=='X';

const sc=c=>wild(c)?0:(c=='JD'||c=='QS')?2:1;
function menuH(){return`<div class="ov"><div class="card"><h2>♠ Dame de Pique ♠</h2>

<div style="display:flex;gap:6px;align-items:center"><input id="cd" maxlength="5" placeholder="Room code" autocapitalize="characters" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #e6c36a88;background:#0006;color:#f3ead2;font:inherit;text-transform:uppercase"><button data-a="joinc" style="width:auto;margin:0">Join</button></div>
${net?'<p style="font-size:14px;color:var(--gold)">'+net+'</p>':''}${room&&net.includes('Waiting for your')?'<input id="lk" readonly value="'+lnk()+'" style="width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid #e6c36a88;background:#0006;color:#f3ead2;font:13px sans-serif"><button data-a="share">Copy invite link</button>'+(location.protocol=='file:'?'<p style="font-size:12px">This link only works once the file is hosted online (e.g. GitHub Pages). Until then, share the room code.</p>':''):''}
${S?'<button class="s2" data-a="resume">Resume current game</button>':''}<details><summary>How to play</summary><p style="text-align:left;font-size:13px">Each turn: tap the deck (hidden card) or the top discard (you take the whole pile). Lay down 3+ cards of one rank with at least 2 natural cards and at most 1 wild (2 or Joker) per new set. Extend your own sets with matching cards or wilds. Cards with a blue + can be added to a blue-glowing set; green glow marks cards you just picked up. You may take the discard pile only if you already hold at least 2 natural cards of the same rank as its top card; otherwise draw from the deck. Then discard one card. <b>Bloque:</b> if you discard an Ace while your opponent has an Ace set, they must draw from the deck. Empty your hand to end the round. Sets score +, cards left in hand score −. 2–9 = 5, 10–A = 10, 2/Joker = 20, J♦ = 50, Q♠ = 100.</p></details></div></div>`}
let seenSpecial=-1,seenOne=-1,showRules=false;
function popup(text,cls){const e=document.createElement('div');e.className=cls;if(cls==='special-flash'){const b=document.createElement('div');b.className='big';b.textContent=text;e.append(b)}else e.textContent=text;document.body.append(e);setTimeout(()=>e.remove(),2700)}
function roundValue(i){if(S.over&&S.res)return S.res[i].d;let meld=S.melds[i].reduce((n,m)=>n+m.c.reduce((x,c)=>x+pts(c),0),0);let hand=S.hands[i].reduce((n,c)=>n+pts(c),0);return meld-hand}
function scoreH(i){return `<div class="scoreline"><span>Previous rounds: <b>${S.scores[i]-(S.over&&S.res?S.res[i].d:0)}</b></span><span>Current round: <b>${roundValue(i)>0?'+':''}${roundValue(i)}</b></span><span>Total${S.over?'':' if round ended now'}: <b>${S.scores[i]+(S.over?0:roundValue(i))}</b></span></div>`}
function rulesH(){return `<div class="rules-panel"><div class="rules-inner"><h2>♠ Card point values</h2><table><tr><th>Card</th><th>Points</th></tr><tr><td>3–9</td><td>5</td></tr><tr><td>10, J, Q, K, A</td><td>10</td></tr><tr><td>J♦ (Jack of Diamonds)</td><td>50</td></tr><tr><td>Q♠ (Queen of Spades)</td><td>100</td></tr><tr><td>2 or Joker (wild)</td><td>20</td></tr></table><p>Cards in sets add points; cards left in hand subtract points.</p><h2>Previous rounds</h2>${S&&S.history?.length?`<table class="score-history"><tr><th>Round</th><th>Player 1</th><th>Player 2</th></tr>${S.history.map(x=>`<tr><td>${x.round}</td><td>${x.points[0]>0?'+':''}${x.points[0]}</td><td>${x.points[1]>0?'+':''}${x.points[1]}</td></tr>`).join('')}</table>`:'<p>No completed rounds yet.</p>'}<button data-a="closeRules">Close</button></div></div>`}
function render(){S=ai?L:D;const a=$('#app');if(S&&!S.hl){S.hl=[[],[]];S.bq=0;S.blk=-1}
if(!S||menu){a.innerHTML=menuH();return}
me=ai?0:S.seats.indexOf(myid);const v=me<0?0:me,o=1-v,mine=me>=0&&!S.over&&S.turn==me&&(S.seats[1]||ai);
const wait=!ai&&!S.seats[1],canJoin=wait&&me<0;
let h=`<div class="bar"><h1>♠ DAME DE PIQUE · R${S.round}</h1><span><button class="s2" data-a="rules" style="padding:5px 10px">Points</button> <button class="s2" data-a="snd" style="padding:5px 10px">${mute?'🔇':'🔊'}</button> <button class="s2" data-a="menu" style="padding:5px 10px">Menu</button></span></div>`;
if(net)h+=`<div class="lbl" style="text-align:center">${net}</div>`;
if(wait){h+=`<div class="card" style="margin:20px auto"><h2>Waiting for your partner…</h2><p>Share this page’s link with her. She needs access that lets her interact, then she taps Join.</p>${canJoin?'<button data-a="join">Join as player 2</button>':''}</div>`;a.innerHTML=h;return}
h+=`<div class="sec player-panel ${S.turn==o&&!S.over?'active':''}" style="overflow:visible"><div class="lbl">${S.turn==o&&!S.over?'● ':''}${nm(o)} · ${S.hands[o].length} cards ${S.hands[o].length===1?'<span class="one-card">⚠ ONE CARD!</span>':''} ${S.turn==o&&!S.over?'<span class="turn-label">YOUR OPPONENT’S TURN</span>':''}</div>${scoreH(o)}<div class="row">${S.melds[o].map((m,i)=>meldH(m,i,0)).join('')||'<span class="lbl">No sets yet</span>'}</div></div>`;
const top=S.pile[S.pile.length-1],dr=mine&&S.phase=='draw',bk=dr&&S.blk==me,hn=hlIdx(S.hands[v],S.hl[v]||[]),pl=mine&&S.phase=='play'?S.hands[v].map((c,i)=>i).filter(i=>ext(me,[i])>=0):[],hint=dr?(bk?'BLOQUÉ! Draw from the deck.':canTakePile(me)?'Tap the deck or take the discard pile.':'Discard pile requires 2 natural cards matching its top card.'):(ai&&S.turn==1&&!S.over?'Thinking…':'');
h+=`<div class="tbl"><div class="pc ${dr?'g':''}" data-a="stock"><div class="c b"></div><b>Deck ${S.deck.length}</b></div>
<div class="msg">${note||(S.msg||'')+(hint?'<br><b>'+hint+'</b>':'')}</div>
<div class="pc ${dr&&!bk&&canTakePile(me)?'g':''}" data-a="pile">${top?card(top):'<div class="c e"></div>'}<b>Discards ${S.pile.length}</b></div></div>
<div class="sec player-panel ${S.turn==v&&!S.over?'active':''}" style="min-height:56px;overflow:visible"><div class="lbl">${S.turn==v&&!S.over?'● ':''}${nm(v)} · ${S.hands[v].length} cards ${S.hands[v].length===1?'<span class="one-card">⚠ ONE CARD!</span>':''} ${S.turn==v&&!S.over?'<span class="turn-label">YOUR TURN</span>':''}</div>${scoreH(v)}<div class="row">${S.melds[v].map((m,i)=>meldH(m,i,mine&&S.phase=='play'&&sel.length,mine&&S.phase=='play'&&S.hands[v].some(c=>wild(c)||rk(c)==m.r))).join('')||'<span class="lbl">No sets yet</span>'}</div></div>
<div class="hand">${S.hands[v].map((c,i)=>card(c,{i,s:sel.includes(i),n:hn.includes(i),p:pl.includes(i)})).join('')}</div>
<div class="acts"><button data-a="meld" ${mine&&S.phase=='play'&&okSet(sel.map(i=>S.hands[v][i]))?'':'disabled'}>Lay down set</button><button data-a="ext" ${mine&&S.phase=='play'&&sel.length&&ext(me,sel)>=0?'':'disabled'}>Extend set</button><button data-a="disc" ${mine&&S.phase=='play'&&sel.length==1?'':'disabled'}>Discard</button></div>
`;
if(S.over){const r=S.res;h+=`<div class="ov"><div class="card"><h2>${S.out<0?'Deck ran out':nm(S.out)+(S.out==me||ai&&S.out==0?' went out!':' went out!')}</h2><table><tr><th></th><th>${nm(v)}</th><th>${nm(o)}</th></tr>
<tr><td>Sets</td><td>+${r[v].m}</td><td>+${r[o].m}</td></tr><tr><td>In hand</td><td>−${r[v].h}</td><td>−${r[o].h}</td></tr><tr><td>Round</td><td>${r[v].d}</td><td>${r[o].d}</td></tr><tr><th>Total</th><th>${S.scores[v]}</th><th>${S.scores[o]}</th></tr></table>
${me>=0?'<button data-a="next">Next round</button>':''}</div></div>`}
a.innerHTML=h+(showRules?rulesH():'');
if(S.fx&&S.fx>seenSpecial&&S.special?.length){popup(S.special.map(c=>c==='JD'?'♦ JACK OF DIAMONDS! +50':'♠ QUEEN OF SPADES! +100').join('  ·  '),'special-flash')}
seenSpecial=S.fx||0;
if(S.oneEvent&&S.oneEvent>seenOne&&S.oneWho>=0){popup((S.oneWho===me?'YOU HAVE':'OPPONENT HAS')+' ONE CARD!','one-flash');snd('turn')}
seenOne=S.oneEvent||0;
if(S.bq>seen&&S.bq>0)bloque();seen=S.bq;if(note!=ln){if(note)snd('bad');ln=note}if(mine&&S.phase=='draw'){if(!tp)snd('turn');tp=1}else tp=0;let ek=S.over?S.round+'-'+S.scores:'';if(ek&&ek!=es)endFx(S.res[v].d>S.res[o].d);es=ek;
if(ai&&S.turn==1&&!S.over&&!busy){busy=true;setTimeout(aiTurn,1000)}}
$('#app').onclick=e=>{ac();const x=e.target.closest('[data-a],[data-i],[data-m]');if(!x||!S&&!x.dataset.a)return;const d=x.dataset;note='';
const mine=S&&me>=0&&!S.over&&S.turn==me&&(S.seats[1]||ai);
if(d.i!=null){snd('tap');let i=+d.i;sel=sel.includes(i)?sel.filter(k=>k!=i):[...sel,i];return render()}
if(d.m!=null){if(mine&&S.phase=='play'&&sel.length){if(doAdd(me,sel,+d.m))return save();note='Those cards don’t fit that set.'}return render()}
switch(d.a){
case'ai':ai=true;L=fresh();S=L;L.mode='ai';deal();menu=false;return save();
case'host':ai=false;myid='host';menu=true;host();return;
case'joinc':join($('#cd').value);return;
case'share':{let u=lnk(),i=$('#lk'),m=r=>{net='Waiting for your partner\u2026 Code: '+room+' \u2014 '+r;render()};
let f=()=>{let ok=0;try{i.select();i.setSelectionRange(0,999);ok=document.execCommand('copy')}catch(e){}m(ok?'link copied!':'tap the link above and copy it');let j=$('#lk');if(j&&!ok){j.focus();j.select()}};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>m('link copied!'),f);else f();return}
case'resume':menu=false;return render();
case'snd':mute=!mute;if(mute&&'speechSynthesis' in window)window.speechSynthesis.cancel();return render();
case'menu':menu=true;return render();
case'rules':showRules=true;return render();
case'closeRules':showRules=false;return render();
case'join':D.seats[1]=myid;return save();
case'stock':if(mine&&S.phase=='draw'){dStock(me);save()}return;
case'pile':if(mine&&S.phase=='draw'&&S.pile.length){if(S.blk==me){note='Bloqué! You must draw from the deck.';return render()}if(!canTakePile(me)){note='You need 2 natural cards matching the top discard to take the pile.';return render()}dPile(me);save()}return;
case'ext':if(mine&&S.phase=='play'){let k=ext(me,sel);if(k>=0&&doAdd(me,sel,k))return save()}return;
case'meld':if(mine&&S.phase=='play'){if(doMeld(me,sel))return save();note='A new set needs at least 2 matching natural cards and at most 1 Joker or 2.';render()}return;
case'disc':if(mine&&S.phase=='play'&&sel.length==1){doDisc(me,sel[0]);save()}return;
case'next':S.round++;S.starter=1-S.starter;deal();return save();}};
function lnk(){return location.href.split('#')[0]+'#'+room}
const NT='https://ntfy.sh/',mid=Math.random().toString(36).slice(2,12);
let ev=null,iv=null,to=null,seq=0,revision=0,lastMessage=0,connected=false,networkQueue=Promise.resolve(),lastFx=0;
async function encodeState(obj){let raw=JSON.stringify(obj);if(typeof CompressionStream==='undefined')return {raw};let bytes=new TextEncoder().encode(raw),stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));let buf=await new Response(stream).arrayBuffer();let binary='',arr=new Uint8Array(buf);for(let i=0;i<arr.length;i+=8192)binary+=String.fromCharCode(...arr.subarray(i,i+8192));return {gz:btoa(binary)}}
async function decodeState(m){if(m.raw)return JSON.parse(m.raw);if(!m.gz)return null;let bin=atob(m.gz),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}
async function pub(m){if(!room)return false;m.f=mid;m.q=++seq;let body=JSON.stringify(m);if(new TextEncoder().encode(body).length>3900){net='Game update too large for relay. A dedicated game server is required.';render();return false}for(let attempt=0;attempt<3;attempt++){try{let res=await fetch(NT+'dpq-'+room,{method:'POST',body,headers:{'Content-Type':'text/plain'},signal:AbortSignal.timeout(9000)});if(!res.ok)throw Error('Relay '+res.status);return true}catch(e){if(attempt===2){net='⚠ Relay delivery failed. Retrying synchronization…';render();return false}await new Promise(r=>setTimeout(r,700*(attempt+1)))}}}
function sub(onm,onopen){if(ev)ev.close();ev=new EventSource(NT+'dpq-'+room+'/sse');ev.addEventListener('open',()=>{connected=true;net='';lastMessage=Date.now();onopen?.();render()});ev.addEventListener('error',()=>{connected=false;net='⚠ Relay reconnecting… Your game is preserved.';render()});ev.addEventListener('message',e=>{try{let d=JSON.parse(e.data);if(d.event&&d.event!=='message')return;let m=JSON.parse(d.message);if(m.f!==mid){lastMessage=Date.now();Promise.resolve(onm(m)).catch(()=>{})}}catch(x){}})}
function cleanup(){if(ev){ev.close();ev=null}clearInterval(iv);clearTimeout(to);iv=null;to=null;connected=false;D=null;revision=0;networkQueue=Promise.resolve()}
function sendS(){if(!room||!D)return;let state=structuredClone(D),v=++revision;networkQueue=networkQueue.then(async()=>pub({t:'s',v,p:await encodeState(state)}));}
async function receiveS(m){if(m.t!=='s'||!m.p||m.v<=revision)return;let state=await decodeState(m.p);if(!state||!Array.isArray(state.hands)||!Array.isArray(state.melds))return;let prev=D?.fx||0;revision=m.v;D=state;if(state.fx>prev&&state.special?.length){state.special.forEach(sfx)}net='';menu=false;render()}
function syncRequest(){if(room&&D)pub({t:'sync',v:revision});else if(room)pub({t:'join'})}
function host(){cleanup();room=Math.random().toString(36).slice(2,8).toUpperCase();net='Starting…';render();sub(async m=>{if(m.t==='join'){if(!D||!D.seats[1]){ai=false;D=fresh();D.seats=['host','guest'];S=D;deal();revision=0}net='';menu=false;sendS();render()}else if(m.t==='s')await receiveS(m);else if(m.t==='sync'){if(D&&revision>=m.v)sendSnapshot();else syncRequest()}},()=>{net='Waiting for your partner… Code: '+room;render();if(D)syncRequest()});iv=setInterval(()=>{if(D)syncRequest()},12000)}
function sendSnapshot(){if(!D)return;let state=structuredClone(D),v=revision;networkQueue=networkQueue.then(async()=>pub({t:'s',v,p:await encodeState(state)}))}
function join(code){cleanup();ai=false;myid='guest';room=String(code).toUpperCase().trim();if(!/^[A-Z0-9]{5,6}$/.test(room)){net='Enter a valid room code.';render();return}net='Connecting…';render();sub(async m=>{if(m.t==='s'){let first=!D;await receiveS(m);if(first&&D){clearTimeout(to)}}else if(m.t==='sync'){if(D&&revision>m.v)sendSnapshot();else if(!D)pub({t:'join'})}},()=>{net='Connected to relay. Finding host…';render();syncRequest()});iv=setInterval(()=>syncRequest(),9000);to=setTimeout(()=>{if(!D){net='Waiting for host. Keep both game tabs open and verify the room code.';render()}},25000)}
if(location.hash.length>1)join(location.hash.slice(1));else render();
</script></body></html>
